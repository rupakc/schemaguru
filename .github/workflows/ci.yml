name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: mypy --strict src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
        shell: bash
      - run: pytest -m "not integration and not live and not benchmark" --cov
        shell: bash

  # The agent surfaces whose SDKs are extras (MCP, framework adapters) and the bring-your-own-
  # connection tests (SQLAlchemy). The default test job installs only [dev], where these skip;
  # here a skip is a failure (SCHEMAGURU_FORBID_SKIPS, tests/conftest.py).
  extras:
    runs-on: ubuntu-latest
    env:
      SCHEMAGURU_FORBID_SKIPS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,anthropic,langchain,llamaindex,openai-agents]" "sqlalchemy>=2"
      - run: >-
          pytest -rs -p no:cacheprovider
          tests/unit/agent/test_mcp.py tests/unit/agent/test_adapters.py
          tests/unit/test_connectors.py tests/acceptance

  integration:
    runs-on: ubuntu-latest
    env:
      # An engine listed here that is missing (no DSN, no driver, no server) fails the job
      # instead of skipping. Locally the same tests skip.
      SCHEMAGURU_REQUIRE_ENGINES: postgres,mysql,clickhouse,tsql,trino
      SCHEMAGURU_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      SCHEMAGURU_TEST_MYSQL_DSN: mysql://root:root@127.0.0.1:3306/
      SCHEMAGURU_TEST_CLICKHOUSE_DSN: clickhouse://sg:sg@localhost:8123/
      SCHEMAGURU_TEST_TSQL_DSN: >-
        DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD=Sg_Passw0rd!;TrustServerCertificate=yes
      SCHEMAGURU_TEST_TRINO_DSN: trino://schemaguru@localhost:8080/memory
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s
          --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: sg
          CLICKHOUSE_PASSWORD: sg
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 5s
          --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Sg_Passw0rd!
        ports: ["1433:1433"]
      trino:
        image: trinodb/trino:484
        ports: ["8080:8080"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Microsoft ODBC Driver 18 for SQL Server
        run: |
          # Some runner images already ship the Microsoft repo; installing it again conflicts.
          if [ ! -e /etc/apt/sources.list.d/microsoft-prod.list ]; then
            curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
          fi
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - run: pip install -e ".[dev,postgres,mysql,clickhouse,mssql,trino]"
      - name: Wait for the slow engines (SQL Server, Trino)
        run: |
          python - <<'PY'
          import os, time, urllib.request
          import pyodbc
          deadline = time.time() + 240
          while True:
              try:
                  pyodbc.connect(os.environ["SCHEMAGURU_TEST_TSQL_DSN"], timeout=5).close()
                  break
              except Exception as exc:
                  if time.time() > deadline:
                      raise SystemExit(f"SQL Server did not become ready: {exc}")
                  time.sleep(3)
          while True:
              try:
                  with urllib.request.urlopen("http://localhost:8080/v1/info", timeout=5) as r:
                      if b'"starting":false' in r.read().replace(b" ", b""):
                          break
              except Exception:
                  pass
              if time.time() > deadline:
                  raise SystemExit("Trino did not become ready")
              time.sleep(3)
          PY
      - run: pytest -m integration -rs -p no:cacheprovider

  denylist:
    # skipped on pull requests from forks (they cannot read the secret)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SCHEMAGURU_DENYLIST: ${{ secrets.SCHEMAGURU_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      # On the upstream's main the secret is required: an empty one would skip the scan silently.
      # Forks and pull requests (which may not see the secret) still pass with the scan skipped.
      - name: Require the denylist secret on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'rupakc/schemaguru'
        run: |
          if [ -z "$SCHEMAGURU_DENYLIST" ]; then
            echo "::error::SCHEMAGURU_DENYLIST is empty; the denylist scan would be skipped"
            exit 1
          fi
      - run: pytest tests/architecture/test_denylist.py -rs -p no:cacheprovider

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
