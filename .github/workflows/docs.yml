name: Docs

# Builds the documentation site (mkdocs-material + mkdocstrings) and the in-browser playground,
# and publishes it to the gh-pages branch. The repository's Pages source must be set to the
# gh-pages branch once (Settings -> Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: write  # push to gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: pip install build "mkdocs-material" "mkdocstrings[python]"
      - name: Build the schemaguru wheel from this commit
        run: python -m build --wheel --outdir build/playground
      - name: Install it (with the extras the docs and the store need)
        run: pip install "$(ls build/playground/schemaguru-*.whl)[duckdb,lineage]"
      - name: Fetch the factlang wheel the playground installs (the pinned release)
        run: |
          pip download "factlang==$(python -c 'import importlib.metadata as m; print(m.version("factlang"))')" \
            --no-deps --only-binary=:all: -d build/playground
      - name: Build the playground store
        run: python scripts/build_playground_store.py --out build/playground
      - name: Smoke-test the glue in a clean venv (the wheels only, no extras)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install build/playground/*.whl
          cd /tmp && /tmp/smoke/bin/python -I "$GITHUB_WORKSPACE/site-playground/glue.py" "$GITHUB_WORKSPACE/build/playground"
      - name: Check the generated pages are current
        run: |
          python scripts/gen_docs.py
          git diff --exit-code -- docs/
      - name: Build the site
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
