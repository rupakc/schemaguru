name: Release

# A version tag (v*) publishes that commit: build and verify -> PyPI (Trusted Publishing) ->
# GitHub Release. The PyPI trusted publisher is registered for this workflow file name and the
# `pypi` environment; renaming either breaks publishing. No API token is used anywhere.
on:
  push:
    tags: ["v*"]

# One release per tag; never cancel a release that is already publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches schemaguru.__about__.__version__
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('src/schemaguru/__about__.py')['__version__'])")
          echo "tag=${GITHUB_REF_NAME} version=${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/schemaguru/
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: SchemaGuru ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
