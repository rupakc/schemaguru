<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="sg-logo-t">
  <title id="sg-logo-t">SchemaGuru: a guru meditating on a schema</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".45"/>
      <stop offset=".7" stop-color="#2dd4bf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- halo -->
  <circle cx="230" cy="300" r="200" fill="url(#halo)"/>
  <!-- cushion -->
  <ellipse cx="230" cy="462" rx="160" ry="30" fill="#4338ca"/>
  <ellipse cx="230" cy="452" rx="160" ry="26" fill="#4f46e5"/>
  <!-- crossed legs -->
  <path d="M86 432 Q90 384 160 380 L300 380 Q372 384 376 432 Q300 456 230 452 Q160 456 86 432 Z" fill="#f59e0b"/>
  <path d="M120 428 Q180 404 236 424" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <path d="M342 428 Q282 404 226 424" fill="none" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="160" cy="424" rx="22" ry="12" fill="#fcd2a8"/>
  <ellipse cx="302" cy="424" rx="22" ry="12" fill="#fcd2a8"/>
  <!-- torso / robe -->
  <path d="M168 300 Q230 278 292 300 Q328 352 334 404 Q230 424 126 404 Q132 352 168 300 Z" fill="url(#robe)"/>
  <!-- sash -->
  <path d="M176 302 Q232 356 300 400" fill="none" stroke="#e11d48" stroke-width="14" stroke-linecap="round" opacity=".85"/>
  <!-- arms -->
  <path d="M170 306 Q128 350 136 392" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
  <path d="M290 306 Q332 350 324 392" fill="none" stroke="#f59e0b" stroke-width="30" stroke-linecap="round"/>
  <!-- hands in mudra on knees -->
  <circle cx="138" cy="398" r="17" fill="#fde2c4" stroke="#f0b98a" stroke-width="3"/>
  <circle cx="322" cy="398" r="17" fill="#fde2c4" stroke="#f0b98a" stroke-width="3"/>
  <circle cx="138" cy="398" r="5" fill="none" stroke="#d99366" stroke-width="3"/>
  <circle cx="322" cy="398" r="5" fill="none" stroke="#d99366" stroke-width="3"/>
  <!-- head -->
  <circle cx="230" cy="214" r="86" fill="#fde2c4"/>
  <!-- ears -->
  <ellipse cx="146" cy="222" rx="14" ry="20" fill="#fbd3ae"/>
  <ellipse cx="314" cy="222" rx="14" ry="20" fill="#fbd3ae"/>
  <!-- top-knot -->
  <circle cx="230" cy="122" r="26" fill="#4b3f72"/>
  <path d="M168 168 Q230 112 292 168 Q262 150 230 150 Q198 150 168 168 Z" fill="#4b3f72"/>
  <rect x="214" y="138" width="32" height="10" rx="5" fill="#fbbf24"/>
  <!-- fluffy brows -->
  <path d="M176 196 Q194 182 212 194" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <path d="M248 194 Q266 182 284 196" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <path d="M176 196 Q194 182 212 194" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M248 194 Q266 182 284 196" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <!-- closed, content eyes -->
  <path d="M180 218 Q195 230 210 218" fill="none" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round"/>
  <path d="M250 218 Q265 230 280 218" fill="none" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="180" cy="244" rx="14" ry="8" fill="#fb7185" opacity=".45"/>
  <ellipse cx="280" cy="244" rx="14" ry="8" fill="#fb7185" opacity=".45"/>
  <!-- beard + smile -->
  <path d="M186 258 Q230 300 274 258 Q270 300 230 318 Q190 300 186 258 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <path d="M214 258 Q230 270 246 258" fill="none" stroke="#9f5b3a" stroke-width="5" stroke-linecap="round"/>
  <!-- thought dots -->
  <circle cx="318" cy="142" r="8" fill="#ffffff" stroke="#818cf8" stroke-width="4"/>
  <circle cx="342" cy="114" r="12" fill="#ffffff" stroke="#818cf8" stroke-width="4"/>
  <!-- thought bubble -->
  <path d="M368 102 C340 102 336 68 362 62 C362 34 398 26 412 44 C428 22 466 28 466 56 C494 60 494 98 470 104 C468 126 432 130 420 114 C404 130 372 126 368 102 Z" fill="#ffffff" stroke="#818cf8" stroke-width="5"/>
  <!-- tiny schema: two tables joined -->
  <g>
    <rect x="368" y="56" width="38" height="40" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <rect x="368" y="56" width="38" height="11" rx="5" fill="#4f46e5"/>
    <path d="M374 76h26M374 86h20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <rect x="430" y="66" width="38" height="40" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="3"/>
    <rect x="430" y="66" width="38" height="11" rx="5" fill="#0d9488"/>
    <path d="M436 86h26M436 96h18" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M406 76 C418 76 418 86 430 86" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <circle cx="406" cy="76" r="4" fill="#d97706"/><circle cx="430" cy="86" r="4" fill="#d97706"/>
  </g>
  <!-- floating data sparkles -->
  <g fill="#2dd4bf"><circle cx="70" cy="200" r="6"/><circle cx="96" cy="150" r="4"/></g>
  <g fill="#fbbf24"><circle cx="394" cy="232" r="5"/><circle cx="420" cy="276" r="7"/></g>
  <g transform="translate(52 266)" opacity=".9">
    <ellipse cx="18" cy="6" rx="18" ry="6" fill="#c7d2fe" stroke="#6366f1" stroke-width="3"/>
    <path d="M0 6v22c0 3.3 8 6 18 6s18-2.7 18-6V6" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
    <path d="M0 17c0 3.3 8 6 18 6s18-2.7 18-6" fill="none" stroke="#6366f1" stroke-width="3"/>
  </g>
</svg>
