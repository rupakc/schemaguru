site_name: SchemaGuru
site_description: >-
  Schema intelligence for AI agents on data warehouses: discover the catalog, measure what
  really joins, refuse row-multiplying paths, and serve a question-scoped view.
site_url: https://rupakc.github.io/schemaguru/
repo_url: https://github.com/rupakc/schemaguru
repo_name: rupakc/schemaguru
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Rupak Chakraborty — MIT License

docs_dir: docs
exclude_docs: |
  specs/
  wiki/
  generated/
  overrides/

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  font: false
  favicon: assets/favicon.svg
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

hooks:
  - scripts/mkdocs_hooks.py

extra_css:
  - assets/schemaguru.css
  - assets/playground/playground.css

extra_javascript:
  - assets/schemaguru.js
  - assets/playground/playground.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_root_heading: true
            show_source: false
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]
            show_if_no_docstring: false
            heading_level: 3

nav:
  - Home: index.md
  - Features: features.md
  - Playground: playground.md
  - Getting started: getting-started.md
  - Guide:
      - Concepts: guide/concepts.md
      - Crawl the catalog: guide/crawl.md
      - Measure: guide/measure.md
      - Sampling large tables: guide/sampling.md
      - Join graph and path search: guide/graph.md
      - Drafting with an LLM: guide/drafting.md
      - PII and value masking: guide/pii.md
      - Overlays (human YAML): guide/overlays.md
      - Lineage: guide/lineage.md
      - Scoping: guide/scoping.md
      - Rendering views: guide/rendering.md
      - Refresh and drift: guide/refresh.md
      - Runtime feedback: guide/feedback.md
      - Agents, tools and MCP: guide/agents.md
      - Server mode: guide/server.md
      - Configuration: guide/configuration.md
      - Cost and scale: guide/cost-and-scale.md
      - Scale: guide/scale.md
      - Security: guide/security.md
  - Extending:
      - Overview: extending/index.md
      - Catalog reader: extending/catalog-reader.md
      - Store: extending/store.md
      - Retriever and embedder: extending/retriever.md
      - Token counter: extending/token-counter.md
      - LLM provider: extending/llm-provider.md
      - PII detector: extending/pii-detector.md
      - Failure classifier: extending/failure-classifier.md
      - Fact kind: extending/fact-kind.md
      - Render profile and format: extending/profile-format.md
      - Change classifier: extending/change-classifier.md
      - Join candidate source: extending/join-candidates.md
      - Server authenticator: extending/authenticator.md
  - Reference:
      - Python API: reference/api.md
      - CLI: reference/cli.md
      - Diagnostics: reference/diagnostics.md
  - Examples: examples.md
