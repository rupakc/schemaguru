<!doctype html>
<!-- Source of docs/assets/social-card.png (1200x630, the og:image).
     Re-render with: python3 scripts/render_social_card.py -->
<html lang="en"><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: #f1f5f9; overflow: hidden;
    background:
      radial-gradient(700px 420px at 92% 8%, rgba(129,140,248,.32), transparent 70%),
      radial-gradient(600px 380px at 4% 100%, rgba(45,212,191,.22), transparent 70%),
      #0f172a;
    padding: 72px 80px; display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 40px; font-weight: 800; letter-spacing: -.01em; }
  .brand img { width: 68px; height: 68px; }
  .guru { position: absolute; right: 36px; top: 96px; width: 380px; height: 380px; }
  h1 { margin-top: 48px; font-size: 50px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; max-width: 760px; }
  .grad { background: linear-gradient(120deg, #818cf8 0%, #38bdf8 55%, #2dd4bf 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 22px; font-size: 24px; line-height: 1.4; color: #a9b6cb; max-width: 690px; }
  .foot { margin-top: auto; display: flex; gap: 16px; align-items: center; font-size: 24px; }
  .chip { padding: 10px 20px; border-radius: 999px; border: 2px solid #334155; background: #1e293b; }
  .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
  .url { margin-left: auto; color: #a9b6cb; }
</style></head><body>
  <div class="brand">
    <img src="../../docs/assets/favicon.svg" alt="">
    SchemaGuru
  </div>
  <img class="guru" src="../../docs/assets/logo.svg" alt="">
  <h1>Your agent reads the names.<br><span class="grad">SchemaGuru reads the data.</span></h1>
  <p>Measured joins, real values and pitfalls, PII masked by default, lineage. Schema intelligence for AI agents on data warehouses.</p>
  <div class="foot">
    <span class="chip mono">pip install schemaguru</span>
    <span class="chip">Open source · MIT</span>
    <span class="url">rupakc.github.io/schemaguru</span>
  </div>
</body></html>
